[tools]
go = "1.26.1"
bun = "1.3.14"

[tasks.install]
description = "Fetch frontend deps (bun)"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/.bin"]

[tasks.generate]
description = "Regenerate sqlc + templ code"
run = ["go tool sqlc generate", "go tool templ generate"]
sources = ["db/queries/*.sql", "db/migrations/*.sql", "view/**/*.templ", "sqlc.yaml"]

[tasks.assets]
description = "Bundle frontend deps into app.css"
depends = ["install"]
run = "bunx @tailwindcss/cli -i assets/app.css -o internal/webui/static/app.css"
sources = ["assets/**", "view/**/*.templ"]
outputs = ["internal/webui/static/app.css"]

[tasks.build]
description = "Generate + bundle + go build"
depends = ["generate", "assets"]
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -ldflags=\"-w -s\" -o app ./cmd/api"
run_windows = "go build -trimpath -ldflags=\"-w -s\" -o app.exe ./cmd/api"

[tasks.run]
description = "Build + run"
depends = ["build"]
run = "sudo ./app"
run_windows = "./app.exe"

[tasks.clean]
description = "Remove build artifacts"
run = '''
rm -f app
find internal/webui/static -mindepth 1 -delete
rm -f internal/store/models.go internal/store/db.go internal/store/*.sql.go
find view -name '*_templ.go' -delete
'''
